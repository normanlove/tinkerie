# Publishes a release for each new version. On every push to main (or when
# run by hand from the Actions tab) it reads VERSION from build.sh; if there's
# no release called v<VERSION> yet, it tests, builds every platform with
# package.sh and publishes the files. To release: change the version in
# build.sh (and launcher/launcher.go, build.bat), then push.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read # the SignPath step reads this run's artifact
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version new?
        id: v
        run: |
          v=$(sed -n 's/^VERSION=//p' build.sh)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=no" >> "$GITHUB_OUTPUT"; echo "v$v is already released."
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.v.outputs.new == 'yes'
        with:
          go-version: '1.24'
      - name: Test Flashie and shared code
        if: steps.v.outputs.new == 'yes'
        run: go test ./apps/flashie/... ./apps/codie/... ./shared/... .
      - name: Build and package
        if: steps.v.outputs.new == 'yes'
        run: ./package.sh
      # Signing (see .signpath/README.md). Skipped until SignPath is set up.
      - name: Upload Tinkerie.exe for signing
        id: unsigned
        if: steps.v.outputs.new == 'yes' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: Tinkerie-exe-unsigned
          path: dist/packages/Tinkerie.exe
          if-no-files-found: error
      - name: Sign Tinkerie.exe (waits for the maintainer to approve in SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tinkerie
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.v.outputs.version) }}
      - name: Use the signed Tinkerie.exe
        if: steps.unsigned.outcome == 'success'
        run: |
          v="${{ steps.v.outputs.version }}"
          cp signed/Tinkerie.exe dist/packages/Tinkerie.exe
          cd dist/packages
          mkdir -p swap/Tinkerie-$v-windows
          cp Tinkerie.exe swap/Tinkerie-$v-windows/
          (cd swap && zip -q ../Tinkerie-$v-windows.zip Tinkerie-$v-windows/Tinkerie.exe)
          rm -rf swap
      - name: Publish release
        if: steps.v.outputs.new == 'yes'
        run: |
          cd dist/packages
          v="${{ steps.v.outputs.version }}"
          cp Tinkerie.exe "Tinkerie-$v-windows.exe"  # every download carries its version in its name
          pre=""; case "${{ steps.v.outputs.version }}" in *-*) pre="--prerelease";; esac
          gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" $pre \
            --title "Tinkerie ${{ steps.v.outputs.version }}" --notes-file notes.md \
            "Tinkerie-$v-windows.exe" Tinkerie-*.zip Tinkerie-*.tar.gz
