# Publishes a release when a version tag (like v1.5.1) is pushed:
# builds every platform with package.sh and uploads the files.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test Flashie and shared code
        run: go test ./apps/flashie/... ./shared/... .
      - name: Build and package
        run: ./package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/packages
          gh release create "$GITHUB_REF_NAME" --title "Tinkerie ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            Tinkerie.exe Tinkerie-*.zip Tinkerie-*.tar.gz
