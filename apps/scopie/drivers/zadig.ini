# Settings for Zadig, preset by Scopie
[general]
  advanced_mode = false
  exit_on_success = false
  log_level = 1

[device]
  # Show every USB device, so the oscilloscope is always in the list
  list_all = true
  include_hubs = false
  trim_whitespaces = true

[driver]
  # WinUSB = 0 (what Scopie needs)
  default_driver = 0
  extract_only = false
