<!doctype html>
<!-- Tunie — 3D printer calibration helper · part of the nrmluvdev maker suite · created by nrmluvdev -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="nrmluvdev">
<title>Tunie — 3D printer calibration</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand"><img src="icon.png" alt=""><div><b>Tunie</b><small>by nrmluvdev</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b>Tunie</b> <span id="ver"></span><br>
      Part of the free nrmluvdev maker suite — Wirie · Scopie · Makie · Flashie · Tunie<br>
      Created by <b>nrmluvdev</b>
    </div>
  </aside>
  <section class="main">
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <label class="picker" title="Active printer"><span id="printer-ico"></span><select id="pick-printer"></select></label>
      <label class="picker" title="Active filament"><span class="swatch" id="fil-swatch"></span><select id="pick-filament"></select></label>
      <button class="pill" id="conn-pill"><span class="dot"></span><span id="conn-text">Not connected</span></button>
    </header>
    <div class="view" id="view"></div>
  </section>
</div>
<div id="toasts"></div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/firmware.js"></script>
<script src="js/tests.js"></script>
<script src="js/preview.js"></script>
<script src="js/wizard.js"></script>
<script src="js/mesh.js"></script>
<script src="js/belt.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
<script src="teach-tips.js"></script>
<script src="teach.js"></script>
</body>
</html>
